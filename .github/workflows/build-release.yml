name: Build Release

# 打标签（v1.0.0 这种）或手动触发时，自动构建 macOS 与 Windows 安装包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: windows-latest
            target: ''
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      # tauri-action 负责：前端构建 → Rust 编译 → 打包 dmg/nsis → 上传到 Release
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KuroCat 大肥鱼自定义版 ${{ github.ref_name }}'
          releaseBody: |
            ## 安装说明

            **macOS**：下载 `.dmg`，打开后把 KuroCat 拖进「应用程序」。
            首次打开若提示「无法验证开发者」，在终端执行一次：

            ```bash
            xattr -cr /Applications/KuroCat.app
            ```

            然后在「系统设置 → 隐私与安全性」里，给 **辅助功能** 和 **输入监控** 两个开关都勾上 KuroCat。

            **Windows**：下载 `-setup.exe` 直接安装。若提示缺少 WebView2，安装时它会引导你补上。

            ## 配置模型

            首次打开聊天窗会提示配置文件位置（macOS 在
            `~/Library/Application Support/kuro-cat-pet/providers.json`），
            把里面 `"key": ""` 填上你自己的 API Key 即可。**Key 不在本仓库里。**
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
