name: Build Installers

# 打标签（v1.0.0）会构建并挂到 Draft Release；
# 手动触发只构建并上传为 Actions artifact，不发版 —— 用来验证 Windows 能不能编过。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限；不声明时 GITHUB_TOKEN 默认只读
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            label: macOS-AppleSilicon
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            label: macOS-Intel
          - platform: windows-latest
            target: ''
            bundles: nsis
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    # 防止某个 runner 排队/卡死时无限期占住 release
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rustup 不接受空参数，Windows 那一路跳过
      - name: Add macOS target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri:build -- --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npm run tauri:build -- --bundles ${{ matrix.bundles }}
          fi

      # 自己打 DMG 和 zip：Tauri 内置的 DMG 打包依赖 AppleScript 控制 Finder，
      # 在 CI 里不稳。hdiutil / ditto 是确定性的。
      - name: Package macOS
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          # 不写死 target triple，自动定位产物
          APP="$(find src-tauri/target -type d -name 'KuroCat.app' -path '*/release/bundle/macos/*' | head -1)"
          if [ -z "$APP" ]; then echo "找不到 KuroCat.app"; find src-tauri/target -maxdepth 4 -name '*.app' -type d; exit 1; fi
          OUT="$(dirname "$APP")"
          NAME="KuroCat-${{ github.ref_name }}-${{ matrix.label }}"
          echo "APP=$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/$NAME.app.zip"

          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "KuroCat" -srcfolder "$STAGE" -ov -format UDZO \
            -fs HFS+ "$OUT/$NAME.dmg"
          rm -rf "$STAGE"
          ls -lh "$OUT"/*.dmg "$OUT"/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.zip
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

      - name: Attach to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KuroCat 大肥鱼自定义版 ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            ## 这一版新增了什么

            - **🧠 深度思考开关** —— 输入框下方新增按钮，临时让她「想一下再答」。状态会记住。
            - **🔍 深入 / 📄 导出对话** —— 回答超过 200 字时，下方出现两个按钮：「深入」把最近三轮对话复制好并打开 DeepSeek 网页版；「导出对话」写成 Markdown 放进下载文件夹，可以直接拖进网页版当附件。
            - **📁 本地找文件** —— 聊天窗里输入「找 关键词」，直接搜本机文件名，**完全不经过模型**。支持分词模糊匹配（「兔采购」能找到「BMMCs 兔实验一期采购清单」）和外置盘。
            - **聊天窗跟随** —— 拖动桌宠时聊天窗保持相对位置一起走，标题栏也能拖。

            ## ⚠️ macOS 需要三个权限，缺一个就会有功能不正常

            | 权限 | 不开的后果 |
            |---|---|
            | 辅助功能 | 她不会跟着你敲键盘、不跟鼠标 |
            | 输入监控 | 同上 |
            | **完全磁盘访问权限** | **「找文件」搜不到桌面和文稿里的东西** |

            位置都在「系统设置 → 隐私与安全性」里。**改完必须退出软件重新打开才生效。**

            > 第三个权限是最容易踩的坑：不开的时候搜索命令执行成功、错误日志为空，
            > 但系统会把受保护目录的结果过滤掉，表现成「明明有文件却搜不到」。

            ## 安装

            **macOS**：下载 `.dmg`，把 KuroCat 拖进「应用程序」。
            首次打开若提示「无法验证开发者」或「已损坏」，终端执行一次：

            ```bash
            xattr -cr /Applications/KuroCat.app
            ```

            然后到「系统设置 → 隐私与安全性」，把上面三个权限都勾上。

            **Windows**：下载 `-setup.exe` 安装。首次运行会被 SmartScreen 拦一下，
            点「更多信息」→「仍要运行」即可（软件没有购买微软的数字签名）。Windows 不需要额外授权。

            ## 配置模型（可选）

            宠物本体不联网，不配也能用 —— 只是不能聊天。
            首次打开聊天窗她会提示配置文件位置，把 `"key": ""` 填上自己的 API Key：

            ```json
            "model": "deepseek-v4-pro",
            "key": "sk-你的key",
            "thinking": "disabled"
            ```

            - `model` 可以换成 `deepseek-flash`（更便宜更快，但知识面窄）
            - `thinking` 建议 `disabled`，否则每次回答前都会先思考几秒

            > API Key 不在本仓库中，也不会打进安装包，只由本地 Rust 侧读取。

            ## 已知问题

            - 聊天窗跟随时略有卡顿（每秒约 60 次跨窗口位置同步），功能可用，暂未优化。
            - Windows 版只验证了编译、安装、桌宠显示与键鼠响应；聊天窗和文件查找未在 Windows 实测。

            ## 完整说明

            - 详细安装步骤：[安装教程.md](https://github.com/2326146/kurocat-dafeiyu/blob/main/%E5%AE%89%E8%A3%85%E6%95%99%E7%A8%8B.md)
            - 版本历史：[CHANGELOG.md](https://github.com/2326146/kurocat-dafeiyu/blob/main/CHANGELOG.md)
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.zip
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
