name: Build Installers

# 打标签（v1.0.0）会构建并挂到 Draft Release；
# 手动触发只构建并上传为 Actions artifact，不发版 —— 用来验证 Windows 能不能编过。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限；不声明时 GITHUB_TOKEN 默认只读
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            label: macOS-AppleSilicon
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            label: macOS-Intel
          - platform: windows-latest
            target: ''
            bundles: nsis
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    # 防止某个 runner 排队/卡死时无限期占住 release
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rustup 不接受空参数，Windows 那一路跳过
      - name: Add macOS target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri:build -- --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npm run tauri:build -- --bundles ${{ matrix.bundles }}
          fi

      # 自己打 DMG 和 zip：Tauri 内置的 DMG 打包依赖 AppleScript 控制 Finder，
      # 在 CI 里不稳。hdiutil / ditto 是确定性的。
      - name: Package macOS
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          # 不写死 target triple，自动定位产物
          APP="$(find src-tauri/target -type d -name 'KuroCat.app' -path '*/release/bundle/macos/*' | head -1)"
          if [ -z "$APP" ]; then echo "找不到 KuroCat.app"; find src-tauri/target -maxdepth 4 -name '*.app' -type d; exit 1; fi
          OUT="$(dirname "$APP")"
          NAME="KuroCat-${{ github.ref_name }}-${{ matrix.label }}"
          echo "APP=$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/$NAME.app.zip"

          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "KuroCat" -srcfolder "$STAGE" -ov -format UDZO \
            -fs HFS+ "$OUT/$NAME.dmg"
          rm -rf "$STAGE"
          ls -lh "$OUT"/*.dmg "$OUT"/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.zip
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

      - name: Attach to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KuroCat 大肥鱼自定义版 ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            ## 安装

            **macOS**：下载 `.dmg`，把 KuroCat 拖进「应用程序」。
            首次打开若提示「无法验证开发者」或「已损坏」，终端执行一次：

            ```bash
            xattr -cr /Applications/KuroCat.app
            ```

            然后到「系统设置 → 隐私与安全性」，把 **辅助功能** 和 **输入监控** 都勾上 KuroCat。

            **Windows**：下载 `-setup.exe` 安装。

            ## 配置模型（可选）

            宠物本身不需要联网。想聊天时，首次打开聊天窗会提示配置文件位置，
            把 `"key": ""` 填上你自己的 API Key 即可。

            > API Key 不在本仓库中，也不会打进安装包。
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.zip
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
